services:
  postgres:
    image: postgres:16
    container_name: buy-ticket-go-postgres
    hostname: buy-ticket-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buy_ticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buy_ticket"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buy-ticket-go-network

  redis:
    image: redis:7
    container_name: buy-ticket-go-redis
    hostname: buy-ticket-go-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buy-ticket-go-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: buy-ticket-go-rabbitmq
    hostname: buy-ticket-go-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buy-ticket-go-network

volumes:
  postgres_data:
    name: buy-ticket-go-postgres-data
  redis_data:
    name: buy-ticket-go-redis-data
  rabbitmq_data:
    name: buy-ticket-go-rabbitmq-data

networks:
  buy-ticket-go-network:
    name: buy-ticket-go-network
