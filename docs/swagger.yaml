      merchant_trade_no:
        type: string
      method:
        type: string
      order_id:
        type: integer
      provider:
        type: string
      provider_trade_no:
        type: string
      status:
        type: string
      succeeded_at:
        type: string
      updated_at:
        type: string
    type: object
  controller.PaymentResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      failed_at:
        type: string
      id:
        type: integer
      method:
        type: string
      order_id:
        type: integer
      paid_at:
        type: string
      payment_no:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  controller.QueueStatusResponse:
    properties:
      ahead_count:
        type: integer
      estimated_wait_seconds:
        type: integer
      event_id:
        type: integer
      expired_at:
        type: string
      joined_at:
        type: string
      purchase_token:
        type: string
      purchase_token_expires_at:
        type: string
      queue_position:
        type: integer
      queue_token:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  controller.ReservationResponse:
    properties:
      created_at:
        type: string
      event_id:
        type: integer
      expires_at:
