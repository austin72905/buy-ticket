  controller.ReserveTicketRequest:
    properties:
      event_id:
        example: 1
        type: integer
      hold_until:
        example: "2026-06-10T19:00:00+08:00"
        type: string
      purchase_token:
        example: pt_01JXABCDEFG1234567890
        type: string
      quantity:
        example: 2
        type: integer
      section_id:
        example: 1
        type: integer
    type: object
  controller.RevealSensitiveRequest:
    properties:
      reason:
        type: string
    type: object
  controller.SaleStatusResponse:
    properties:
      can_join_queue:
        type: boolean
      can_reserve:
        type: boolean
      event_id:
        type: integer
      event_status:
