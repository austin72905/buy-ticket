basePath: /
definitions:
  controller.CancelReservationRequest:
    properties:
      cancelled_at:
        type: string
      reservation_id:
        type: integer
    type: object
  controller.CreateOrderRequest:
    properties:
      expires_at:
        type: string
      order_no:
        type: string
      reservation_id:
        type: integer
    type: object
  controller.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  controller.EventResponse:
    properties:
      created_at:
        type: string
      end_at:
        type: string
      id:
        type: integer
      name:
        type: string
      sale_end_at:
        type: string
      sale_start_at:
        type: string
      start_at:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      venue:
        type: string
    type: object
  controller.ExpireReservationRequest:
    properties:
      expired_at:
        type: string
      reservation_id:
        type: integer
    type: object
  controller.JoinQueueRequest:
    properties:
      access_code:
        type: string
      channel:
        type: string
      client_id:
        type: string
      event_id:
        type: integer
      request_id:
        type: string
    type: object
  controller.JoinQueueResponse:
    properties:
      ahead_count:
        type: integer
      estimated_wait_seconds:
        type: integer
      event_id:
        type: integer
      expired_at:
        type: string
      joined_at:
        type: string
      purchase_token:
        type: string
      purchase_token_expires_at:
        type: string
      queue_position:
        type: integer
      queue_token:
        type: string
      status:
        type: integer
      user_id:
        type: integer
    type: object
  controller.OrderResponse:
    properties:
      created_at:
        type: string
      event_id:
        type: integer
      expires_at:
        type: string
      id:
        type: integer
      order_no:
        type: string
      quantity:
        type: integer
      reservation_id:
        type: integer
      section_id:
        type: integer
      status:
        type: integer
      total_amount:
        type: integer
      unit_price:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  controller.PayOrderRequest:
    properties:
      amount:
        type: integer
      method:
        type: string
      order_id:
        type: integer
      paid_at:
        type: string
      payment_no:
        type: string
    type: object
  controller.PaymentResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      failed_at:
        type: string
      id:
        type: integer
      method:
        type: string
      order_id:
        type: integer
      paid_at:
        type: string
      payment_no:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  controller.QueueStatusResponse:
    properties:
      ahead_count:
        type: integer
      estimated_wait_seconds:
        type: integer
      event_id:
        type: integer
      expired_at:
        type: string
      joined_at:
        type: string
      purchase_token:
        type: string
      purchase_token_expires_at:
        type: string
      queue_position:
        type: integer
      queue_token:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  controller.ReservationResponse:
    properties:
      created_at:
        type: string
      event_id:
        type: integer
      expires_at:
        type: string
      id:
        type: integer
      quantity:
        type: integer
      section_id:
        type: integer
      status:
        type: integer
      total_amount:
        type: integer
      unit_price:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  controller.ReserveTicketRequest:
    properties:
      event_id:
        example: 1
        type: integer
      hold_until:
        example: "2026-06-10T19:00:00+08:00"
        type: string
      purchase_token:
        example: pt_01JXABCDEFG1234567890
        type: string
      quantity:
        example: 2
        type: integer
      section_id:
        example: 1
        type: integer
    type: object
  controller.SaleStatusResponse:
    properties:
      can_join_queue:
        type: boolean
      can_reserve:
        type: boolean
      event_id:
        type: integer
      event_status:
        type: integer
      is_on_sale:
        type: boolean
      queue_enabled:
        type: boolean
      sale_end_at:
        type: string
      sale_start_at:
        type: string
      server_time:
        type: string
    type: object
  controller.SectionAvailabilityResponse:
    properties:
      available_quantity:
        type: integer
      name:
        type: string
      price:
        type: integer
      reserved_quantity:
        type: integer
      section_id:
        type: integer
      sold_quantity:
        type: integer
      status:
        type: integer
    type: object
  controller.SectionResponse:
    properties:
      created_at:
        type: string
      event_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      price:
        type: integer
      purchase_limit:
        type: integer
      reserved_quantity:
        type: integer
      sold_quantity:
        type: integer
      status:
        type: integer
      total_quantity:
        type: integer
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: 搶票系統 API
  title: buy-ticket API
  version: "1.0"
paths:
  /events:
    get:
      description: List all available events.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controller.EventResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: List events
      tags:
      - events
  /events/{eventId}:
    get:
      description: Get event detail by event ID.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Get event
      tags:
      - events
  /events/{eventId}/availability:
    get:
      description: Get section availability for an event.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controller.SectionAvailabilityResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Get section availability
      tags:
      - events
  /events/{eventId}/sections:
    get:
      description: Get all sections for an event.
      parameters:
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controller.SectionResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Get event sections
      tags:
      - events
  /me/orders:
    get:
      description: List orders for the current authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controller.OrderResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: List my orders
      tags:
      - orders
  /me/payments:
    get:
      description: List payments for the current authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controller.PaymentResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: List my payments
      tags:
      - payments
  /me/reservations:
    get:
      description: List reservations for the current authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controller.ReservationResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: List my reservations
      tags:
      - reservations
  /orders:
    post:
      consumes:
      - application/json
      description: Create an order from an existing reservation.
      parameters:
      - description: Create order request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controller.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controller.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Create order
      tags:
      - orders
  /orders/{orderId}:
    get:
      description: Get order detail by order ID.
      parameters:
      - description: Order ID
        in: path
        name: orderId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Get order
      tags:
      - orders
  /orders/order-no/{orderNo}:
    get:
      description: Get order detail by order number.
      parameters:
      - description: Order Number
        in: path
        name: orderNo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.OrderResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Get order by order number
      tags:
      - orders
  /payments:
    post:
      consumes:
      - application/json
      description: Submit payment for an order.
      parameters:
      - description: Pay order request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controller.PayOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Pay order
      tags:
      - payments
  /payments/{paymentNo}:
    get:
      description: Get payment detail by payment number.
      parameters:
      - description: Payment Number
        in: path
        name: paymentNo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.PaymentResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Get payment by payment number
      tags:
      - payments
  /payments/provider/ecpay/callback:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Handle ECPay callback and update payment status by MerchantTradeNo
        and RtnCode.
      parameters:
      - description: Merchant ID
        in: formData
        name: MerchantID
        type: string
      - description: Merchant Trade Number
        in: formData
        name: MerchantTradeNo
        required: true
        type: string
      - description: Return Code
        in: formData
        name: RtnCode
        required: true
        type: string
      - description: Return Message
        in: formData
        name: RtnMsg
        type: string
      - description: Trade Number
        in: formData
        name: TradeNo
        type: string
      - description: Trade Amount
        in: formData
        name: TradeAmt
        type: string
      - description: Payment Date
        in: formData
        name: PaymentDate
        type: string
      - description: Payment Type
        in: formData
        name: PaymentType
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: 1|OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Handle ECPay callback
      tags:
      - payments
  /queue/join:
    post:
      consumes:
      - application/json
      description: Join the queue for an event and return queue status.
      parameters:
      - description: Join queue request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controller.JoinQueueRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controller.JoinQueueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Join queue
      tags:
      - queue
  /queue/status/{queueToken}:
    get:
      description: Get queue status by queue token, including purchase token if granted.
      parameters:
      - description: Queue Token
        in: path
        name: queueToken
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.QueueStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Get queue status
      tags:
      - queue
  /reservations:
    post:
      consumes:
      - application/json
      description: Create a reservation for selected section and quantity.
      parameters:
      - description: Reserve ticket request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controller.ReserveTicketRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controller.ReservationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Reserve ticket
      tags:
      - reservations
  /reservations/{reservationId}:
    get:
      description: Get reservation detail by reservation ID.
      parameters:
      - description: Reservation ID
        in: path
        name: reservationId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.ReservationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Get reservation
      tags:
      - reservations
  /reservations/cancel:
    post:
      consumes:
      - application/json
      description: Cancel a reservation.
      parameters:
      - description: Cancel reservation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controller.CancelReservationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.ReservationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Cancel reservation
      tags:
      - reservations
  /reservations/expire:
    post:
      consumes:
      - application/json
      description: Mark a reservation as expired.
      parameters:
      - description: Expire reservation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controller.ExpireReservationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.ReservationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Expire reservation
      tags:
      - reservations
  /sale/status:
    get:
      description: Get sale status for an event by event_id.
      parameters:
      - description: Event ID
        in: query
        name: event_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.SaleStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.ErrorResponse'
      summary: Get sale status
      tags:
      - sale
swagger: "2.0"
