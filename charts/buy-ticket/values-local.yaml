api:
  replicaCount: 2

image:
  repository: buy-ticket
  tag: local
  pullPolicy: IfNotPresent

web:
  image:
    repository: buy-ticket-web
    tag: local
    pullPolicy: IfNotPresent

migration:
  image:
    repository: buy-ticket-migrate
    tag: local
    pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080

app:
  pprofEnabled: true

ingress:
  enabled: false

postgres:
  dsn: "postgres://postgres:postgres@host.k3d.internal:5432/buy_ticket?sslmode=disable"

redis:
  addr: "host.k3d.internal:6379"

session:
  ttlHours: 168

payment:
  mock:
    baseURL: "http://host.k3d.internal:8081"
    backupBaseURL: ""
    callbackURL: "http://host.k3d.internal:8080/payments/provider/ecpay/callback"
  breaker:
    enabled: true
    consecutiveFailures: 5
    openTimeoutSeconds: 30
    halfOpenMaxRequests: 1
  reconcile:
    enabled: true
    batchSize: 100
    delaySeconds: 120
    retryAfterSeconds: 30
    maxAttempts: 5

outbox:
  publish:
    enabled: true
    batchSize: 100
    retryAfterSeconds: 30

scheduler:
  enabled: true
  replicaCount: 1
