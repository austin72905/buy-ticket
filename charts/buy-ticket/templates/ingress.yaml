{{- if .Values.ingress.enabled }}
{{- if and .Values.ingress.api.stripPrefix .Values.ingress.api.stripPrefixMiddleware.apiVersion }}
apiVersion: {{ .Values.ingress.api.stripPrefixMiddleware.apiVersion }}
kind: Middleware
metadata:
  name: {{ include "buy-ticket.fullname" . }}-strip-api-prefix
  labels:
    {{- include "buy-ticket.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ .Values.ingress.api.path | quote }}
---
{{- end }}
{{- if .Values.web.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "buy-ticket.fullname" . }}-web
  labels:
    {{- include "buy-ticket.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.web.path }}
            pathType: {{ $.Values.ingress.web.pathType }}
            backend:
              service:
                name: {{ include "buy-ticket.fullname" $ }}-web
                port:
                  name: http
    {{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "buy-ticket.fullname" . }}-api
  labels:
    {{- include "buy-ticket.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- if or .Values.ingress.api.stripPrefix .Values.ingress.annotations }}
  annotations:
    {{- if .Values.ingress.api.stripPrefix }}
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-{{ include "buy-ticket.fullname" . }}-strip-api-prefix@kubernetescrd"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.api.path }}
            pathType: {{ $.Values.ingress.api.pathType }}
            backend:
              service:
                name: {{ include "buy-ticket.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
